    <!-- Liquid Glass Preloader -->
    <style id="preloader-styles">
      #app-preloader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef2f7,#ffffff 52%,#e8eef7);transition:opacity .7s cubic-bezier(.22,1,.36,1);will-change:opacity}
      #app-preloader.light-preloader{background:linear-gradient(135deg,#eef2f7,#ffffff 52%,#e8eef7)}
      #app-preloader.fade-out{opacity:0;pointer-events:none}
      .preloader-container{display:flex;flex-direction:column;align-items:center;gap:36px}
      .glass-orb-wrapper{position:relative;width:120px;height:120px}
      .glass-orb{position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(226,232,240,.42) 48%,rgba(255,255,255,.82));backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid rgba(255,255,255,.92);box-shadow:0 18px 42px rgba(71,85,105,.18),inset 0 2px 10px rgba(255,255,255,.98),inset 0 -2px 10px rgba(148,163,184,.16);animation:glass-breathe 3.6s cubic-bezier(.4,0,.6,1) infinite}
      .glass-orb::before{content:'';position:absolute;top:8%;left:18%;width:52%;height:38%;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.55),rgba(255,255,255,.08) 70%,transparent);filter:blur(1px);animation:specular-shift 3s cubic-bezier(.4,0,.6,1) infinite}
      .glass-orb::after{content:'';position:absolute;inset:12%;border-radius:50%;border:1px solid rgba(255,255,255,.72);background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.42),transparent 65%);animation:caustic-rotate 8s linear infinite}
      .glass-orb-logo{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none;animation:logo-fade-in .9s cubic-bezier(.16,1,.3,1) .12s both}
      .glass-orb-logo img{height:66px;width:auto;object-fit:contain;filter:drop-shadow(0 0 .6px rgba(15,23,42,.7)) drop-shadow(0 8px 14px rgba(15,23,42,.22)) drop-shadow(0 0 18px rgba(168,85,247,.4));animation:glass-logo-breathe 3.6s cubic-bezier(.4,0,.6,1) infinite}
      .glass-particle{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.98),rgba(96,165,250,.42));filter:blur(.5px)}
      .glass-particle:nth-child(1){width:6px;height:6px;top:50%;left:50%;animation:orbit-1 2.4s cubic-bezier(.4,0,.6,1) infinite}
      .glass-particle:nth-child(2){width:4px;height:4px;top:50%;left:50%;animation:orbit-2 3.2s cubic-bezier(.4,0,.6,1) infinite}
      .glass-particle:nth-child(3){width:5px;height:5px;top:50%;left:50%;animation:orbit-3 2.8s cubic-bezier(.4,0,.6,1) infinite}
      .glass-glow-ring{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(96,165,250,.12) 40%,rgba(255,255,255,.22) 60%,transparent 75%);animation:glow-pulse 3.4s ease-in-out infinite}
      .glass-progress-ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:rgba(37,99,235,.72);border-right-color:rgba(148,163,184,.42);animation:progress-spin 1.4s cubic-bezier(.4,0,.6,1) infinite;filter:drop-shadow(0 0 4px rgba(37,99,235,.24))}
      .preloader-text{font-family:'Space Grotesk',system-ui,sans-serif;font-size:13px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:rgba(51,65,85,.7);animation:text-fade 2.5s ease-in-out infinite}
      @keyframes glass-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      @keyframes specular-shift{0%,100%{transform:translate(0,0) scale(1);opacity:.7}50%{transform:translate(3px,-2px) scale(1.05);opacity:1}}
      @keyframes caustic-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
      @keyframes glass-logo-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      @keyframes logo-fade-in{from{opacity:0}to{opacity:1}}
      @keyframes orbit-1{0%{transform:translate(-3px,-3px) rotate(0deg) translateX(52px) rotate(0deg);opacity:.9}50%{opacity:.4}100%{transform:translate(-3px,-3px) rotate(360deg) translateX(52px) rotate(-360deg);opacity:.9}}
      @keyframes orbit-2{0%{transform:translate(-2px,-2px) rotate(120deg) translateX(58px) rotate(-120deg);opacity:.7}50%{opacity:.3}100%{transform:translate(-2px,-2px) rotate(480deg) translateX(58px) rotate(-480deg);opacity:.7}}
      @keyframes orbit-3{0%{transform:translate(-2.5px,-2.5px) rotate(240deg) translateX(48px) rotate(-240deg);opacity:.8}50%{opacity:.35}100%{transform:translate(-2.5px,-2.5px) rotate(600deg) translateX(48px) rotate(-600deg);opacity:.8}}
      @keyframes glow-pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
      @keyframes progress-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
      @keyframes text-fade{0%,100%{opacity:.5}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.glass-orb,.glass-orb::before,.glass-orb::after,.glass-particle,.glass-glow-ring,.glass-progress-ring,.glass-orb-logo,.glass-orb-logo img,.preloader-text{animation:none!important}}
    </style>
  </head>
  <body data-route="__ROUTE__">
    <div id="app-preloader" aria-label="Loading" role="progressbar">
      <div class="preloader-container">
        <div class="glass-orb-wrapper">
          <div class="glass-glow-ring"></div>
          <div class="glass-progress-ring"></div>
          <div class="glass-orb"></div>
          <div class="glass-orb-logo">
            <img src="/b.png" alt="Bipul Roy" />
          </div>
          <div class="glass-particle"></div>
          <div class="glass-particle"></div>
          <div class="glass-particle"></div>
        </div>
        <div class="preloader-text">Loading</div>
      </div>
    </div>

    <!-- Preloader safety net: the app removes the loader on mount, but a slow
         connection or a failed bundle must never leave a spinner running. -->
    <script>
      (function () {
        setTimeout(function () {
          var loader = document.getElementById("app-preloader");
          if (!loader) return;
          loader.style.opacity = "0";
          loader.style.pointerEvents = "none";
          setTimeout(function () {
            loader.remove();
            var styles = document.getElementById("preloader-styles");
            if (styles) styles.remove();
          }, 700);
        }, 4000);
      })();
    </script>

    <div id="root">__ARTICLE_CONTENT__</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
