    <!-- Liquid Glass Preloader — renders before JS bundle -->
    <style id="preloader-styles">
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1e0549;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), backdrop-filter 0.6s ease;
        will-change: opacity;
      }
      #app-preloader.light-preloader {
        background: #faf5ff;
      }
      #app-preloader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .preloader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 36px;
      }

      /* ── Liquid glass orb ── */
      .glass-orb-wrapper {
        position: relative;
        width: 120px;
        height: 120px;
      }

      .glass-orb {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          rgba(124, 58, 237, 0.25) 0%,
          rgba(168, 85, 247, 0.15) 40%,
          rgba(79, 13, 193, 0.30) 100%
        );
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(183, 150, 230, 0.25);
        box-shadow:
          0 8px 32px rgba(124, 58, 237, 0.3),
          inset 0 2px 8px rgba(255, 255, 255, 0.15),
          inset 0 -2px 8px rgba(79, 13, 193, 0.2);
        animation: glass-breathe 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Specular highlight — top glint */
      .glass-orb::before {
        content: '';
        position: absolute;
        top: 8%;
        left: 18%;
        width: 52%;
        height: 38%;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at 50% 30%,
          rgba(255, 255, 255, 0.55) 0%,
          rgba(255, 255, 255, 0.08) 70%,
          transparent 100%
        );
        filter: blur(1px);
        animation: specular-shift 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Inner caustic ring */
      .glass-orb::after {
        content: '';
        position: absolute;
        inset: 12%;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: radial-gradient(
          circle at 40% 35%,
          rgba(168, 85, 247, 0.12) 0%,
          transparent 65%
        );
        animation: caustic-rotate 6s linear infinite;
      }

      /* Orbiting particles */
      .glass-particle {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(183, 150, 230, 0.9), rgba(124, 58, 237, 0.4));
        filter: blur(0.5px);
      }
      .glass-particle:nth-child(1) {
        width: 6px; height: 6px;
        top: 50%; left: 50%;
        animation: orbit-1 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .glass-particle:nth-child(2) {
        width: 4px; height: 4px;
        top: 50%; left: 50%;
        animation: orbit-2 3.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .glass-particle:nth-child(3) {
        width: 5px; height: 5px;
        top: 50%; left: 50%;
        animation: orbit-3 2.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Ambient glow ring */
      .glass-glow-ring {
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(124, 58, 237, 0.08) 40%,
          rgba(168, 85, 247, 0.04) 60%,
          transparent 75%
        );
        animation: glow-pulse 3s ease-in-out infinite;
      }

      /* Progress arc */
      .glass-progress-ring {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: rgba(168, 85, 247, 0.7);
        border-right-color: rgba(124, 58, 237, 0.35);
        animation: progress-spin 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        filter: drop-shadow(0 0 4px rgba(168, 85, 247, 0.5));
      }

      /* Text */
      .preloader-text {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(183, 150, 230, 0.8);
        animation: text-fade 2.5s ease-in-out infinite;
      }
      .light-preloader .preloader-text {
        color: rgba(91, 33, 182, 0.6);
      }

      /* ── Keyframes ── */
      @keyframes glass-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }

      @keyframes specular-shift {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
        50% { transform: translate(3px, -2px) scale(1.05); opacity: 1; }
      }

      @keyframes caustic-rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes orbit-1 {
        0%   { transform: translate(-3px, -3px) rotate(0deg) translateX(52px) rotate(0deg); opacity: 0.9; }
        50%  { opacity: 0.4; }
        100% { transform: translate(-3px, -3px) rotate(360deg) translateX(52px) rotate(-360deg); opacity: 0.9; }
      }
      @keyframes orbit-2 {
        0%   { transform: translate(-2px, -2px) rotate(120deg) translateX(58px) rotate(-120deg); opacity: 0.7; }
        50%  { opacity: 0.3; }
        100% { transform: translate(-2px, -2px) rotate(480deg) translateX(58px) rotate(-480deg); opacity: 0.7; }
      }
      @keyframes orbit-3 {
        0%   { transform: translate(-2.5px, -2.5px) rotate(240deg) translateX(48px) rotate(-240deg); opacity: 0.8; }
        50%  { opacity: 0.35; }
        100% { transform: translate(-2.5px, -2.5px) rotate(600deg) translateX(48px) rotate(-600deg); opacity: 0.8; }
      }

      @keyframes glow-pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); }
      }

      @keyframes progress-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes text-fade {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .glass-orb, .glass-orb::before, .glass-orb::after,
        .glass-particle, .glass-glow-ring, .glass-progress-ring,
        .preloader-text {
          animation: none !important;
        }
      }

      @media (prefers-color-scheme: light) {
        #app-preloader:not(.dark-forced) {
          background: #faf5ff;
        }
        #app-preloader:not(.dark-forced) .preloader-text {
          color: rgba(91, 33, 182, 0.6);
        }
      }
    </style>
